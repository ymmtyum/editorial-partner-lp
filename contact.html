<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="エディトリアル・パートナーへの問い合わせ" />
    <meta property="og:title" content="問い合わせ｜エディトリアル・パートナー" />
    <meta property="og:description" content="ご用件、お名前、メールアドレスを書いてください。会社名と備考は任意です。" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="https://ymmtyum.github.io/editorial-partner-lp/contact.html" />
    <meta property="og:image" content="https://ymmtyum.github.io/editorial-partner-lp/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://ymmtyum.github.io/editorial-partner-lp/og.png" />
    <title>問い合わせ｜エディトリアル・パートナー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=51" />
  </head>
  <body>
    <header class="site-header">
      <p class="hero-brand">エディトリアル・パートナー</p>
    </header>
    <main class="inquiry">
      <div class="inquiry-sheet">
        <h1>問い合わせ</h1>
        <p class="inquiry-lead">ご用件を選んで、お名前とメールアドレスを書いてください。会社名と備考は、分かる範囲で大丈夫です。必要であれば、30分のミーティングでお話しできます。</p>
        <p class="inquiry-required"><span aria-hidden="true">*</span> は必須項目です</p>
        <form id="inquiry-form" method="post" action="" novalidate>
          <fieldset class="inquiry-purpose">
            <legend>ご用件<span class="req" aria-hidden="true">*</span></legend>
            <label><input name="purpose" type="radio" value="制作を依頼したい" required />制作を依頼したい</label>
            <label><input name="purpose" type="radio" value="自分に合うか相談したい" required />自分に合うか相談したい</label>
            <label><input name="purpose" type="radio" value="サービスについて知りたい" required />サービスについて知りたい</label>
            <label><input name="purpose" type="radio" value="その他" required />その他</label>
          </fieldset>
          <label>会社名<input name="company" type="text" autocomplete="organization" maxlength="200" placeholder="株式会社あおば" /></label>
          <label>お名前<span class="req" aria-hidden="true">*</span><input name="name" type="text" autocomplete="name" maxlength="200" placeholder="山田 太郎" required /></label>
          <label>メールアドレス<span class="req" aria-hidden="true">*</span><input name="email" type="email" autocomplete="email" maxlength="200" placeholder="taro@example.com" required /></label>
          <label>備考<textarea name="message" maxlength="4000" placeholder="30分ほどお話しできると助かります。"></textarea></label>
          <div class="inquiry-trap" aria-hidden="true">
            <label>ウェブサイト<input name="website" type="text" tabindex="-1" autocomplete="off" /></label>
          </div>
          <input name="token" type="hidden" value="" />
          <input name="openedAt" type="hidden" value="" />
          <input name="origin" type="hidden" value="" />
          <button class="inquiry-submit" type="submit">送る</button>
          <p class="inquiry-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
    <button class="inquiry-close" type="button" aria-label="閉じる">×</button>
    <iframe class="inquiry-frame" name="inquiry-result" title="送信結果"></iframe>
    <script>
      const inquiryEndpoint = 'https://script.google.com/macros/s/AKfycbyxUaRsVvJkf03waBCYDMUPCx2JJVosyKEu_03Ld7ubfb50Per08sGWqIz_rAXnPnEJEA/exec';
      const inquiryToken = 'editorial-partner';
      const form = document.getElementById('inquiry-form');
      const status = form.querySelector('.inquiry-status');
      const frame = document.querySelector('.inquiry-frame');
      const openedAt = Date.now();
      let waitTimer = 0;

      function inquiryTarget() {
        if (inquiryEndpoint) return inquiryEndpoint;
        if (location.hostname === 'ymmtyum.github.io') return '';
        return '/inquiry-dev';
      }

      function show(text, field) {
        status.textContent = text;
        field?.focus();
      }

      function finish(ok) {
        clearTimeout(waitTimer);
        form.dataset.busy = '';
        show(ok
          ? '受け取りました。内容を確認して、記入されたメールアドレスへ返信します。'
          : '送れませんでした。時間をおいて、もう一度送ってください。');
        if (!ok) return;
        form.dataset.done = '1';
        for (const field of form.elements) {
          if (field.type === 'hidden' || field.type === 'button') continue;
          field.disabled = true;
        }
      }

      form.querySelector('[name="openedAt"]').value = String(openedAt);
      form.querySelector('[name="token"]').value = inquiryToken;
      form.querySelector('[name="origin"]').value = location.origin;
      document.querySelector('.inquiry-close').addEventListener('click', () => window.close());

      function fromInquiryFrame(source) {
        let current = source;
        for (let depth = 0; depth < 5 && current; depth += 1) {
          if (current === frame.contentWindow) return true;
          if (current === window) return false;
          try { current = current.parent; } catch (error) { return false; }
        }
        return false;
      }

      function inquiryMessage(event) {
        const data = event.data;
        if (!data || data.type !== 'inquiry' || typeof data.ok !== 'boolean') return false;
        if (fromInquiryFrame(event.source)) return true;
        const origin = String(event.origin || '');
        return origin === 'null' ||
          origin === 'https://script.google.com' ||
          /^https:\/\/(?:[a-z0-9-]+\.)*googleusercontent\.com$/.test(origin);
      }

      window.addEventListener('message', (event) => {
        if (form.dataset.busy !== '1' || !inquiryMessage(event)) return;
        finish(event.data.ok);
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        if (form.dataset.busy === '1' || form.dataset.done === '1') return;
        if (form.website.value) return;
        const purposes = ['制作を依頼したい', '自分に合うか相談したい', 'サービスについて知りたい', 'その他'];
        const purpose = form.purpose.value;
        const name = form.name.value.trim();
        const email = form.email.value.trim();
        const message = form.message.value.trim();
        if (!purposes.includes(purpose)) {
          show('ご用件を選んでください。', form.querySelector('[name="purpose"]'));
          return;
        }
        if (form.company.value.trim().length > 200) {
          show('会社名は200字までです。', form.company);
          return;
        }
        if (!name) {
          show('お名前を書いてください。', form.name);
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          show('メールアドレスを確認してください。', form.email);
          return;
        }
        if (message.length > 4000) {
          show('備考は4000字までです。', form.message);
          return;
        }
        const remain = 3000 - (Date.now() - openedAt);
        if (remain > 0) {
          form.dataset.busy = '1';
          show('送っています。');
          setTimeout(sendInquiry, remain);
          return;
        }
        sendInquiry();
      });

      function sendInquiry() {
        const target = inquiryTarget();
        if (!target) {
          form.dataset.busy = '';
          show('送れませんでした。時間をおいて、もう一度送ってください。');
          return;
        }
        form.dataset.busy = '1';
        show('送っています。');
        clearTimeout(waitTimer);
        waitTimer = setTimeout(() => finish(false), 15000);
        if (target.startsWith('http') && new URL(target).origin !== location.origin) {
          postViaFrame(target);
          return;
        }
        const body = new URLSearchParams(new FormData(form));
        fetch(target, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body })
          .then((response) => response.text())
          .then((html) => finish(/ok:\s*true/.test(html)))
          .catch(() => finish(false));
      }

      function postViaFrame(target) {
        const transport = document.createElement('form');
        transport.method = 'post';
        transport.action = target;
        transport.target = 'inquiry-result';
        transport.hidden = true;
        for (const field of form.elements) {
          if (!field.name || field.type === 'submit' || field.type === 'button') continue;
          if ((field.type === 'radio' || field.type === 'checkbox') && !field.checked) continue;
          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = field.name;
          input.value = field.value;
          transport.append(input);
        }
        document.body.append(transport);
        transport.submit();
      }
    </script>
  </body>
</html>
